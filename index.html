<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kamery">
<title>Kamery górskie</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1f242c; --line:#2a3039;
    --text:#e8eaed; --muted:#9aa3ad; --accent:#7cc4ff; --ok:#7bd88f; --warn:#ffb86b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(15,18,22,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;flex:1}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  .btn:hover{border-color:#3a424d}
  .toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--accent)}
  nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;
    padding:8px 12px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
  nav button.on{color:var(--text);border-bottom-color:var(--accent)}
  nav .n{opacity:.6;font-size:12px;margin-left:4px}
  main{padding:14px;padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:18px 2px 8px;font-weight:600}
  h2:first-child{margin-top:2px}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  @media (max-width:520px){.grid{grid-template-columns:1fr} main{padding:10px}}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
    cursor:pointer;display:flex;flex-direction:column}
  .tile:hover{border-color:#3a424d}
  .frame{position:relative;aspect-ratio:16/9;background:#0a0c0f;overflow:hidden}
  .frame img,.frame video,.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;display:block}
  .frame iframe{pointer-events:none}
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--muted);font-size:13px;text-align:center;padding:10px;
    background:radial-gradient(ellipse at center,#1a2029 0%,#0a0c0f 75%)}
  .play{width:46px;height:46px;border-radius:50%;background:rgba(124,196,255,.15);
    border:1px solid rgba(124,196,255,.5);display:flex;align-items:center;justify-content:center}
  .play:after{content:"";border-left:14px solid var(--accent);border-top:9px solid transparent;
    border-bottom:9px solid transparent;margin-left:4px}
  .ph.overlay{background:rgba(0,0,0,.15);z-index:1}
  .ph.overlay .play{background:rgba(0,0,0,.45)}
  .badge{position:absolute;z-index:2;top:8px;left:8px;font-size:11px;padding:2px 7px;border-radius:20px;
    background:rgba(0,0,0,.6);color:#fff;letter-spacing:.3px}
  .badge.live{background:rgba(220,40,40,.85)}
  .meta{display:flex;align-items:baseline;gap:8px;padding:8px 10px}
  .meta .name{flex:1;font-weight:550;font-size:14px}
  .meta .info{font-size:12px;color:var(--muted);white-space:nowrap}
  .err{color:var(--warn)}
  /* modal */
  .modal{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column}
  .modal.open{display:flex}
  .mbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
    background:#0f1216;border-bottom:1px solid var(--line)}
  .mbar .t{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mbar a{color:var(--accent);font-size:13px;text-decoration:none;white-space:nowrap}
  .mbody{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  .mbody img,.mbody video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000}
  .mbody iframe{width:100%;height:100%;border:0;background:#000}
  .nav-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(0,0,0,.45);
    color:#fff;border:0;width:44px;height:64px;font-size:26px;cursor:pointer;border-radius:8px}
  .nav-arrow.l{left:6px}.nav-arrow.r{right:6px}
  /* pogoda */
  .wx{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
  .wx-head{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap}
  .wx-head .t{font-weight:600;font-size:14px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
  .wx-head .t .chev{display:inline-block;transition:transform .15s;color:var(--muted);font-size:12px}
  .wx.closed .chev{transform:rotate(-90deg)}
  .wx.closed .wx-body{display:none}
  .wx-head .sp{flex:1}
  .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:20px;
    padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
  .chip.on{color:var(--text);border-color:var(--accent);background:rgba(124,196,255,.12)}
  .wx-body{padding:0 10px 10px}
  .wx-scroll{overflow-x:auto;border-radius:8px;-webkit-overflow-scrolling:touch;max-width:720px}
  .wx-yr{background:#fff}
  .wx-yr img{display:block;width:100%;min-width:560px}
  .wx-icm{background:#fff}
  .wx-icm svg{display:block;width:100%;min-width:560px;height:auto}
  .wx-msg{color:var(--muted);font-size:13px;padding:24px 8px;text-align:center}
  .wx-src{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.35}
  .wx-src a{color:var(--muted)}
  .wxgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),740px))}
  .wxmap{max-width:740px}
  .wxmap .wx-head .t{cursor:default}
  .wxmap iframe{display:block;width:100%;height:440px;border:0;border-radius:8px;background:#0a0c0f}
  @media (max-width:520px){.wxmap iframe{height:340px}}
  .wxcard h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
  footer{color:var(--muted);font-size:12px;padding:6px 16px 24px;text-align:center}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Kamery górskie</h1>
    <label class="toggle" title="Odtwarza strumienie wideo bezpośrednio w kafelkach (zużywa dużo danych)">
      <input type="checkbox" id="autoplay"> wideo w kafelkach
    </label>

    </label>
    <button class="btn" id="refresh" title="Pobierz najnowsze zdjęcia">↻ Odśwież</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>
<footer>Zdjęcia odświeżają się co 5 min, miniatury wideo co 10 min, prognozy co godzinę. Godzina wykonania zdjęcia jest w jego rogu. Obraz należy do właścicieli kamer – kliknij „źródło”, aby przejść na ich stronę.</footer>

<div class="modal" id="modal">

  </div>
  <div class="mbody" id="mbody">
    <button class="nav-arrow l" id="mprev" aria-label="Poprzednia">‹</button>
    <button class="nav-arrow r" id="mnext" aria-label="Następna">›</button>
  </div>
</div>

const REGIONS = ["Beskidy","Tatry","Gorce","Pieniny"];
const REFRESH_MS = 5*60*1000;

/* ======= PUNKTY PROGNOZY ======= */
const PLACES = [
  {k:"rysianka",   n:"Hala Rysianka",        r:"Beskidy", lat:49.5409, lon:19.1306},
  {k:"babia",      n:"Babia Góra",           r:"Beskidy", lat:49.5732, lon:19.5294},

  {k:"luban",      n:"Lubań",                r:"Gorce",   lat:49.4878, lon:20.3420},
  {k:"trzykorony", n:"Trzy Korony",          r:"Pieniny", lat:49.4147, lon:20.4122},
];
const WX_MS = 60*60*1000;
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ł/g,"l").replace(/Ł/g,"L").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const hhmm = d => d.toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});
const bust = u => u + (u.includes("?")?"&":"?") + "t=" + Date.now();

CAMS.forEach((c,i)=>c.i=i);
let current = "wszystkie";
let autoplay = store.get("autoplay", false);
const isMobile = matchMedia("(pointer:coarse)").matches || innerWidth < 700;
let thumbs = store.get("thumbs", !isMobile);
const THUMB_MS = 10*60*1000;
let wxSrc = store.get("wxSrc", "yr");
const players = new Map(); // tile video -> hls instance

/* ---------- tabs ---------- */
function renderTabs(){
  const tabs = [{k:"wszystkie",label:"Wszystkie",n:CAMS.length}]
    .concat(REGIONS.map(r=>({k:slug(r),label:r,n:CAMS.filter(c=>c.r===r).length})))
    .concat([{k:"pogoda",label:"Pogoda",n:PLACES.length}]);
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  tabs.forEach(t=>{
    const b = document.createElement("button");
    b.innerHTML = `${t.label}<span class="n">${t.n}</span>`;
    b.className = t.k===current ? "on" : "";
    b.onclick = () => { location.hash = t.k; };
    nav.appendChild(b);
  });
}

/* ---------- video helpers ---------- */
function attachHls(video, src){
  if (window.Hls && Hls.isSupported()){
    const h = new Hls({lowLatencyMode:false, maxBufferLength:10, capLevelToPlayerSize:true});
    h.loadSource(src); h.attachMedia(video);
    h.on(Hls.Events.ERROR, (e,d)=>{ if(d.fatal){ video.dispatchEvent(new Event("hlsfatal")); } });
    return h;
  }
  video.src = src; return null;
}
function destroyTilePlayers(){
  players.forEach((h,v)=>{ try{h&&h.destroy()}catch(e){} v.removeAttribute("src"); v.load(); });
  players.clear();
}

function showBlocked(container, c){
  if (container.querySelector(".blocked")) return;
  const d = document.createElement("div");
  d.className = "ph blocked";
  d.style.zIndex = 1;
  d.innerHTML = `<div>Nie udało się odtworzyć tego strumienia.<br>Dostawca może blokować odtwarzanie poza swoją stroną.</div>`;
  const a = document.createElement("a");
  a.href = c.p; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.textContent = "Otwórz na stronie źródłowej ↗";
  a.style.color = "var(--accent)";
  a.onclick = e => e.stopPropagation();
  d.appendChild(a);
  container.appendChild(d);
}

/* ---------- miniatury wideo: jedna klatka ze strumienia ---------- */
let thumbList = [];
function stopThumb(t){
  if (t.timer){ clearTimeout(t.timer); t.timer = null; }
  if (t.h){ try{ t.h.destroy(); }catch(e){} t.h = null; }
}
function grabThumb(t){
  stopThumb(t);
  const {v, info} = t;
  v.autoplay = true;
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    if (t.timer){ clearTimeout(t.timer); t.timer = null; }
    try{ v.pause(); }catch(e){}
    if (t.h){ try{ t.h.stopLoad(); }catch(e){} }   // zatrzymaj pobieranie, klatka zostaje
    if (ok){ info.textContent = "podgląd " + hhmm(new Date()); info.classList.remove("err"); }
    else   { info.textContent = "brak podglądu"; info.classList.add("err"); }
  };
  v.onplaying = () => setTimeout(() => finish(true), 300);
  v.onerror = () => finish(false);
  v.addEventListener("hlsfatal", () => finish(false), {once:true});
  t.timer = setTimeout(() => finish(v.readyState >= 2), 15000);
  if (window.Hls && Hls.isSupported()){
    const h = new Hls({maxBufferLength:2, maxMaxBufferLength:4, capLevelToPlayerSize:true, startLevel:0});
    h.on(Hls.Events.ERROR, (e,d)=>{ if(d.fatal) v.dispatchEvent(new Event("hlsfatal")); });
    h.loadSource(t.c.s); h.attachMedia(v);
    t.h = h;
  } else { v.src = t.c.s; }
  v.play().catch(()=>{});
}
function destroyThumbs(){
  thumbList.forEach(t=>{ stopThumb(t); try{ t.v.removeAttribute("src"); t.v.load(); }catch(e){} });
  thumbList = [];
}
function refreshThumbs(){ thumbList.forEach(grabThumb); }


/* ---------- pogoda: yr.no (gotowy SVG) i ICM UM 4 km (dane z API, rysowane tutaj) ---------- */
const TZ = "Europe/Warsaw";
const fmtH = new Intl.DateTimeFormat("pl-PL",{timeZone:TZ,hour:"2-digit",hourCycle:"h23"});
const fmtDay = new Intl.DateTimeFormat("pl-PL",{timeZone:TZ,weekday:"short",day:"numeric",month:"numeric"});
const fmtRun = new Intl.DateTimeFormat("pl-PL",{timeZone:TZ,day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});
const localHour = t => +fmtH.format(t);

const yrUrl = p => `https://www.yr.no/en/content/${p.lat},${p.lon}/meteogram.svg`;
const yrPage = p => `https://www.yr.no/en/forecast/graph/${p.lat},${p.lon}`;

const ICM_API = "https://devmgramapi.meteo.pl/meteorograms";
const ICM_MODEL = "um4_60";   // jak domyślnie w aplikacji Meteo ICM (najnowszy przebieg, 60 h)
const icmLink = p => `https://app.meteo.pl/meteogram/${p.lat.toFixed(2)},${p.lon.toFixed(2)}`;
let icmAvail = {t:0, v:null};
const icmCache = new Map();
async function icmRun(model){
  if (!icmAvail.v || Date.now()-icmAvail.t > 20*60*1000){
    const r = await fetch(ICM_API + "/available", {cache:"no-store"});
    if (!r.ok) throw new Error("available " + r.status);
    icmAvail = {t:Date.now(), v: await r.json()};
  }
  const runs = (icmAvail.v[model] || []);
  if (!runs.length) throw new Error("brak przebiegów " + model);
  return runs[runs.length-1];
}
async function icmData(p, model){
  model = model || ICM_MODEL;
  const run = await icmRun(model);
  const key = p.k + ":" + model + ":" + run;
  if (icmCache.has(key)) return icmCache.get(key);
  const r = await fetch(ICM_API + "/" + model, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({point:{lat:String(p.lat), lon:String(p.lon)}, date:run})});
  if (!r.ok) throw new Error(model + " " + r.status);
  const j = await r.json();
  const d = j.data || {};
  const ser = k => (d[k] && d[k].data || []).map(v => (v === null || v < -1e6 || Number.isNaN(+v)) ? NaN : +v);
  const f = d.airtmp_point;
  const out = { run, model, t0: (+f.first_timestamp)*1000, step: (+f.interval||3600)*1000 };
  ["airtmp_point","airtmp_min","airtmp_max","dwptmp_point","wchill_point","wchill_min","wchill_max",
   "pcpttl_aver","pcpttl_max","pcpttl_type_max","pcpttlprob_point","realhum_aver","slpres_point",
   "wind10_sd_true_prev_point","wind10_dr_deg_true_prev_point","wind_gust_max","visibl_min",
   "cldbse01","cldbse25","cldbse45","cldbse65","cldbse79","cldtop",
   "cldvlow_aver","cldlow_aver","cldmed_aver","cldhigh_aver","cldtot_aver","fog_max"].forEach(k => out[k] = ser(k));
  icmCache.set(key, out);
  return out;
}

// przybliżony wschód/zachód słońca (UTC, ms) dla danego dnia i punktu
function sunTimes(dayUtcMs, lat, lon){
  const rad = Math.PI/180, d = new Date(dayUtcMs);
  const n = Math.floor((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()) - Date.UTC(2000,0,1,12))/864e5) + 1;
  const Js = n - lon/360, M = (357.5291 + 0.98560028*Js) % 360;
  const C = 1.9148*Math.sin(M*rad) + 0.02*Math.sin(2*M*rad) + 0.0003*Math.sin(3*M*rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545 + Js + 0.0053*Math.sin(M*rad) - 0.0069*Math.sin(2*L*rad);
  const dec = Math.asin(Math.sin(L*rad)*Math.sin(23.44*rad));
  const cosw = (Math.sin(-0.83*rad) - Math.sin(lat*rad)*Math.sin(dec)) / (Math.cos(lat*rad)*Math.cos(dec));
  const w = Math.acos(Math.max(-1, Math.min(1, cosw))) / rad;
  const toMs = J => (J - 2440587.5) * 864e5;
  return [toMs(Jt - w/360), toMs(Jt + w/360)];
}

/* Meteogram w układzie aplikacji Meteo ICM (UM 4 km) */
function drawICM(D, p){
  const n = D.airtmp_point.length;
  const W = 800, L = 92, R = 92, PW = W - L - R;
  const C = {lab:"#3a46a8", grid:"#9a9a9a", night:"#e4e4e4", frame:"#222", sky:"#8ec5ee"};
  const t = i => D.t0 + i*D.step;
  const X = i => L + (i + 0.5) * PW / n;            // środek godziny
  const XE = i => L + i * PW / n;                   // lewa krawędź godziny
  const cw = PW / n;
  const fin = a => a.filter(Number.isFinite);
  const f1 = v => (+v).toFixed(1);
  const g = [];
  const text = (x, y, s, o={}) => g.push(`<text x="${f1(x)}" y="${f1(y)}" fill="${o.c||C.lab}" font-size="${o.s||11}" text-anchor="${o.a||'middle'}"${o.r?` transform="rotate(-90 ${f1(x)} ${f1(y)})"`:''}${o.w?` font-weight="${o.w}"`:''}>${s}</text>`);
  const line = (x1,y1,x2,y2,c,w=1,dash) => g.push(`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${c}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''}/>`);
  const rect = (x,y,w,h,c,o=1) => { if (w>0 && h>0) g.push(`<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" fill="${c}"${o<1?` opacity="${o}"`:''}/>`); };
  const pathOf = (arr, Y) => { let d="", pen=false; arr.forEach((v,i)=>{ if (Number.isFinite(v)){ d += (pen?"L":"M")+f1(X(i))+" "+f1(Y(v))+" "; pen=true; } else pen=false; }); return d; };
  const areaOf = (arr, Y, y0) => { let d="", open=false, last=0; arr.forEach((v,i)=>{ if (Number.isFinite(v)){ if(!open){ d+="M"+f1(X(i))+" "+f1(y0)+" "; open=true; } d+="L"+f1(X(i))+" "+f1(Y(v))+" "; last=i; } else if(open){ d+="L"+f1(X(last))+" "+f1(y0)+"Z "; open=false; } }); if(open) d+="L"+f1(X(last))+" "+f1(y0)+"Z"; return d; };
  const piece = (ticks) => (v => { // skala odcinkowo-liniowa: ticks wartości w równych odstępach
    if (!Number.isFinite(v)) return NaN; const k = ticks.length-1;
    if (v <= ticks[0]) return 0; if (v >= ticks[k]) return 1;
    for (let j=0;j<k;j++) if (v <= ticks[j+1]) return (j + (v-ticks[j])/(ticks[j+1]-ticks[j]))/k;
    return 1; });

  // noce (szare tło)
  const tStart = t(0) - D.step/2, tEnd = t(n-1) + D.step/2;
  const xOf = ms => L + (ms - tStart)/(tEnd - tStart) * PW;
  const nights = []; { const days = new Set(); for (let i=-1;i<=n;i++){ const dd=new Date(t(i)); days.add(Date.UTC(dd.getUTCFullYear(),dd.getUTCMonth(),dd.getUTCDate())); }
    let prev = tStart - 864e5; [...days].sort().forEach(day => { const [r,s] = sunTimes(day, p.lat, p.lon); nights.push([prev, r]); prev = s; }); nights.push([prev, tEnd + 864e5]); }

  function panel(y, h, o){
    rect(L, y, PW, h, o.bg || "#fff");
    if (!o.noNight) nights.forEach(([a,b]) => { const x1=Math.max(L,xOf(a)), x2=Math.min(L+PW,xOf(b)); rect(x1, y, x2-x1, h, o.bg ? "#000" : C.night, o.bg ? .12 : 1); });
    if (o.draw) o.draw();
    for (let i=0;i<=n;i++) if (localHour(t(i) - D.step/2) % 3 === 0 && i>0 && i<n) line(XE(i), y, XE(i), y+h, C.grid, .6, "1.5 2.5");
    const ly = yy => Math.min(Math.max(yy+4, y+9), y+h-1);
    (o.lt||[]).forEach(([v,lab]) => { const yy = o.Y(v); if (yy>y+0.5 && yy<y+h-0.5) line(L, yy, L+PW, yy, C.grid, .6, "1.5 2.5"); text(L-6, ly(yy), lab, {a:"end"}); });
    (o.rt||[]).forEach(([v,lab]) => text(L+PW+6, ly(o.Yr ? o.Yr(v) : o.Y(v)), lab, {a:"start", c:o.rc||C.lab}));
    g.push(`<rect x="${L}" y="${f1(y)}" width="${PW}" height="${f1(h)}" fill="none" stroke="${C.frame}" stroke-width="1"/>`);
    if (o.ll) { text(L-64, y+h/2, o.ll, {r:1, s:11}); if (o.lu) text(L-50, y+h/2, o.lu, {r:1, s:10}); }
    if (o.rl) { text(L+PW+58, y+h/2, o.rl, {r:1, s:11, c:o.rc||C.lab}); if (o.ru) text(L+PW+72, y+h/2, o.ru, {r:1, s:10, c:o.rc||C.lab}); }
  }

  let y = 8;
  // nagłówek
  const d0 = new Date(t(0)); const [sr, ss] = sunTimes(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth(),d0.getUTCDate()+ (localHour(t(0))>16?1:0)), p.lat, p.lon);
  const fmtHM = new Intl.DateTimeFormat("pl-PL",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
  text(L, y+10, `wschód słońca: ${fmtHM.format(sr)}`, {a:"start"});
  text(L, y+24, `zachód słońca: ${fmtHM.format(ss)}`, {a:"start"});
  text(L+PW, y+10, `${p.n} (${p.lat.toFixed(2)}, ${p.lon.toFixed(2)})`, {a:"end"});
  text(L+PW, y+24, `${D.model==="um4_60"?"UM4 60h":"UM4 120h"} · przebieg ${fmtRun.format(D.run*1000)}`, {a:"end"});
  y += 30;
  // oś czasu (czas lokalny)
  const axisTop = y;
  for (let i=0;i<n;i++){ const hL = localHour(t(i)); if (hL===12) text(X(i), y+10, fmtDay.format(t(i)), {s:11}); }
  y += 14;
  nights.forEach(([a,b]) => { const x1=Math.max(L,xOf(a)), x2=Math.min(L+PW,xOf(b)); rect(x1, y, x2-x1, 14, C.night); });
  for (let i=0;i<n;i++){ const hL = localHour(t(i)); if (hL % 3 === 0) text(X(i), y+11, String(hL).padStart(2,"0"), {s:10}); }
  text(L+PW+6, y+11, "lokalny", {a:"start", s:10});
  y += 18;

  // 1. temperatura
  { const h = 110;
    const vals = fin([].concat(D.airtmp_min, D.airtmp_max, D.wchill_min, D.wchill_max, D.dwptmp_point, D.airtmp_point));
    let lo = Math.floor((Math.min(...vals)-1)/5)*5, hi = Math.ceil((Math.max(...vals)+1)/5)*5; if (hi-lo < 10) hi = lo + 10;
    const Y = v => y + h - (v-lo)/(hi-lo)*h;
    const ticks = []; for (let v=lo; v<=hi; v+=5) ticks.push([v, String(v)]);
    panel(y, h, {Y, lt:ticks, rt:ticks, ll:"temperatura", lu:"(°C)", rl:"temperatura", ru:"(°C)", draw(){
      if (lo < 0) rect(L, Math.min(Y(0), y+h), PW, y+h-Math.min(Y(0), y+h), "#bfe3f7", .9);         // obszar poniżej 0 °C
      g.push(`<path d="${areaOf(D.dwptmp_point, Y, y+h)}" fill="#3d8fd1" opacity=".35"/>`);            // punkt rosy
      for (let i=0;i<n;i++){
        if (Number.isFinite(D.wchill_min[i])) line(X(i), Y(D.wchill_min[i]), X(i), Y(D.wchill_max[i]), "#5b8be0", .8);
        if (Number.isFinite(D.airtmp_min[i])) line(X(i), Y(D.airtmp_min[i]), X(i), Y(D.airtmp_max[i]), "#e05050", .8);
      }
      g.push(`<path d="${pathOf(D.wchill_point, Y)}" fill="none" stroke="#1f5fd6" stroke-width="2"/>`);
      g.push(`<path d="${pathOf(D.airtmp_point, Y)}" fill="none" stroke="#d01818" stroke-width="2"/>`);
      if (lo < 0 && hi > 0) line(L, Y(0), L+PW, Y(0), "#1f5fd6", .8);
    }});
    y += h + 6; }

  // 2. opad + wilgotność
  { const h = 80;
    const pm = Math.max(5, Math.ceil(Math.max(0, ...fin(D.pcpttl_max))));
    const Y = v => y + h - Math.min(v, pm)/pm*h;
    const Yr = v => y + h - (Math.max(50, Math.min(100, v)) - 50)/50*h;
    const lt = []; const st = pm <= 5 ? 1 : pm <= 10 ? 2 : 5; for (let v=0; v<=pm; v+=st) lt.push([v, String(v)]);
    const rt = [50,60,70,80,90,100].map(v => [v, String(v)]);
    const col = tp => tp >= 3 ? "#1f4fe0" : tp >= 2 ? "#b02cc8" : "#1fa81f";
    panel(y, h, {Y, Yr, lt, rt, rc:"#d4502a", ll:"opad", lu:"(mm/h)", rl:"wilgotność", ru:"(%)", draw(){
      for (let i=0;i<n;i++){
        const mx = D.pcpttl_max[i], av = D.pcpttl_aver[i], tp = D.pcpttl_type_max[i];
        if (Number.isFinite(mx) && mx > 0.05) rect(X(i)-cw*0.35, Y(mx), cw*0.7, y+h-Y(mx), col(tp), .35);
        if (Number.isFinite(av) && av > 0.02) rect(X(i)-cw*0.35, Y(av), cw*0.7, y+h-Y(av), col(tp));
      }
      g.push(`<path d="${pathOf(D.realhum_aver, Yr)}" fill="none" stroke="#d4502a" stroke-width="1.6"/>`);
    }});
    y += h + 6; }

  // 3. szansa opadu
  { const h = 70; const Y = v => y + h - v/100*h; const tk = [0,20,40,60,80,100].map(v=>[v,String(v)]);
    panel(y, h, {Y, lt:tk, rt:tk, ll:"szansa opadu", lu:"(%)", rl:"szansa opadu", ru:"(%)", draw(){
      g.push(`<path d="${pathOf(D.pcpttlprob_point, Y)}" fill="none" stroke="#1a9e1a" stroke-width="1.8"/>`); }});
    y += h + 6; }

  // 4. ciśnienie
  { const h = 70; const hp = D.slpres_point.map(v => v/100);
    let lo = Math.floor((Math.min(...fin(hp))-3)/10)*10, hi = Math.ceil((Math.max(...fin(hp))+3)/10)*10; if (hi-lo<30) hi = lo+30;
    const Y = v => y + h - (v-lo)/(hi-lo)*h;
    const lt = []; for (let v=lo; v<=hi; v+=10) lt.push([v, String(v)]);
    const rt = lt.map(([v]) => [v, String(Math.round(v*0.750062))]);
    const cmap = v => { const st = [[985,[0,230,230]],[1000,[0,230,230]],[1008,[40,200,40]],[1016,[230,230,0]],[1024,[250,140,0]],[1035,[230,40,0]]];
      if (v<=st[0][0]) return st[0][1]; for (let j=0;j<st.length-1;j++){ const [a,ca]=st[j],[b,cb]=st[j+1]; if (v<=b){ const k=(v-a)/(b-a); return ca.map((c,m)=>Math.round(c+(cb[m]-c)*k)); } } return st[st.length-1][1]; };
    panel(y, h, {Y, lt, rt, ll:"ciśnienie", lu:"(hPa)", rl:"ciśnienie", ru:"(mm Hg)", draw(){
      for (let i=0;i<n;i++){ const v = hp[i]; if (!Number.isFinite(v)) continue; const c = cmap(v); rect(XE(i), Y(v), cw+0.4, y+h-Y(v), `rgb(${c})`); }
      g.push(`<path d="${pathOf(hp, Y)}" fill="none" stroke="#000" stroke-width="1.6"/>`); }});
    y += h + 6; }

  // 5. wiatr
  { const h = 70; const gm = Math.max(10, Math.ceil(Math.max(...fin(D.wind_gust_max), ...fin(D.wind10_sd_true_prev_point))/5)*5);
    const Y = v => y + h - Math.min(v, gm)/gm*h;
    const lt = []; const st = gm <= 10 ? 2 : gm <= 25 ? 5 : 10; for (let v=0; v<=gm; v+=st) lt.push([v, String(v)]);
    const rt = lt.map(([v]) => [v, String(Math.round(v*3.6))]);
    panel(y, h, {Y, lt, rt, ll:"wiatr", lu:"(m/s)", rl:"wiatr", ru:"(km/h)", draw(){
      g.push(`<path d="${areaOf(D.wind10_sd_true_prev_point, Y, y+h)}" fill="#2a7fd8"/>`);
      g.push(`<path d="${pathOf(D.wind10_sd_true_prev_point, Y)}" fill="none" stroke="#0b3f8f" stroke-width="1.2"/>`);
      for (let i=0;i<n;i++){ const v = D.wind_gust_max[i]; if (Number.isFinite(v)) line(X(i)-cw*0.35, Y(v), X(i)+cw*0.35, Y(v), "#e02828", 1.6); }
    }});
    y += h + 6; }

  // 6. kierunek wiatru
  { const h = 32;
    panel(y, h, {Y: v=>v, noNight:false, draw(){
      for (let i=0;i<n;i++){ const dr = D.wind10_dr_deg_true_prev_point[i], sp = D.wind10_sd_true_prev_point[i]; if (!Number.isFinite(dr)) continue;
        const len = Math.min(13, 6 + (Number.isFinite(sp)?sp:0)*1.2);
        g.push(`<g transform="translate(${f1(X(i))},${f1(y+h/2)}) rotate(${(dr+180).toFixed(0)})"><line x1="0" y1="${f1(len/2)}" x2="0" y2="${f1(-len/2)}" stroke="#1a2a8f" stroke-width="1.2"/><path d="M0 ${f1(-len/2-2)} L2.2 ${f1(-len/2+2)} L-2.2 ${f1(-len/2+2)}Z" fill="#1a2a8f"/></g>`); }
    }});
    [L-40, L+PW+40].forEach(xx => { text(xx, y+9, "N", {s:10}); text(xx-9, y+19, "W", {s:10}); text(xx+9, y+19, "E", {s:10}); text(xx, y+29, "S", {s:10}); });
    y += h + 6; }

  // 7. podstawy i wierzchołki chmur + widzialność
  { const h = 80;
    const sc = piece([0,0.5,2,7,15]), Y = v => y + h - sc(v)*h;
    const sv = piece([0,1,5,20,100]), Yr = v => y + h - sv(v)*h;
    const lt = [[0,"0.0"],[0.5,"0.5"],[2,"2.0"],[7,"7.0"],[15,"15.0"]];
    const rt = [[0,"0"],[1,"1"],[5,"5"],[20,"20"],[100,"100"]];
    panel(y, h, {Y, Yr, lt, rt, rc:"#e07b00", bg:C.sky, ll:"chmury", lu:"(km)", rl:"widzialność", ru:"(km)", draw(){
      const vis = D.visibl_min.map(v => v/1000);
      g.push(`<path d="${pathOf(vis, Yr)}" fill="none" stroke="#f08c00" stroke-width="1.8"/>`);
      [["cldbse01","#ffffff"],["cldbse25","#d4d4d4"],["cldbse45","#8a8a8a"],["cldbse65","#444"],["cldbse79","#000"],["cldtop","#8e1b1b"]].forEach(([k,c]) => {
        D[k].forEach((v,i) => { if (Number.isFinite(v) && v > 0 && i % 2 === 0) g.push(`<circle cx="${f1(X(i))}" cy="${f1(Y(v))}" r="2.6" fill="${c}"${c==="#ffffff"?' stroke="#666" stroke-width=".5"':''}/>`); }); });
    }});
    y += h + 6; }

  // 8. zachmurzenie (oktanty) + mgła
  { const h = 80; const Y = v => y + h - v/8*h; const Yr = v => y + h - v*h;
    const lt = [0,2,4,6,8].map(v=>[v,String(v)]); const rt = [0,.25,.5,.75,1].map(v=>[v, v.toFixed(2)]);
    const ok = a => a.map(v => Number.isFinite(v) ? v*8 : v);
    panel(y, h, {Y, Yr, lt, rt, rc:"#e07b00", bg:C.sky, ll:"zachmurzenie", lu:"(oktanty)", rl:"mgła", ru:"(frakcja)", draw(){
      g.push(`<path d="${areaOf(ok(D.cldhigh_aver), Y, y+h)}" fill="#d9d9d9" opacity=".85"/>`);
      g.push(`<path d="${areaOf(ok(D.cldmed_aver), Y, y+h)}" fill="#9a9a9a" opacity=".9"/>`);
      g.push(`<path d="${areaOf(ok(D.cldlow_aver), Y, y+h)}" fill="#555" opacity=".95"/>`);
      g.push(`<path d="${areaOf(ok(D.cldvlow_aver), Y, y+h)}" fill="#2e2e2e" opacity=".95"/>`);
      g.push(`<path d="${pathOf(ok(D.cldtot_aver), Y)}" fill="none" stroke="#d8401f" stroke-width="1.6"/>`);
      for (let i=0;i<n;i++){ const v = D.fog_max[i]; if (Number.isFinite(v) && v > 0.01) rect(X(i)-cw*0.2, Yr(v), cw*0.4, y+h-Yr(v), "#f2a516"); }
    }});
    y += h + 4; }

  // oś UTC
  for (let i=0;i<n;i++){ const hU = new Date(t(i)).getUTCHours(); if (hU % 3 === 0) text(X(i), y+11, String(hU).padStart(2,"0"), {s:10}); }
  text(L+PW+6, y+11, "UTC", {a:"start", s:10});
  y += 16;
  // legenda
  const leg = [["#d01818","temperatura"],["#1f5fd6","temp. odczuwalna"],["#3d8fd1","punkt rosy (pole)"],["#1fa81f","deszcz"],["#b02cc8","deszcz ze śniegiem"],["#1f4fe0","śnieg"],["#e02828","porywy"],["#f08c00","widzialność"],["#f2a516","mgła"]];
  let lx = L; leg.forEach(([c,lab]) => { rect(lx, y+3, 10, 8, c); text(lx+13, y+11, lab, {a:"start", s:10, c:"#333"}); lx += 18 + lab.length*5.4; if (lx > L+PW-60){ lx = L; y += 14; } });
  y += 18;
  return `<svg viewBox="0 0 ${W} ${f1(y)}" xmlns="http://www.w3.org/2000/svg" font-family="Lato,system-ui,sans-serif"><rect width="${W}" height="${f1(y)}" fill="#fff"/>${g.join("")}</svg>`;
}

function srcNote(src){
  return src === "yr"
    ? `Prognoza: <a href="https://www.yr.no/" target="_blank" rel="noopener">Yr</a> – Norweski Instytut Meteorologiczny i NRK.`
    : `Prognoza udostępniona bezpłatnie przez serwis <a href="https://www.meteo.pl/" target="_blank" rel="noopener">meteo.pl</a> prowadzony przez ICM UW. Wyniki uzyskano przy użyciu oprogramowania Met Office. Model UM 4 km.`;
}

async function fillWeather(el, p, src){
  el.innerHTML = "";
  if (src === "yr"){
    const sc = document.createElement("div"); sc.className = "wx-scroll wx-yr";
    const img = document.createElement("img");
    img.alt = "Meteogram yr.no – " + p.n; img.referrerPolicy = "no-referrer"; img.loading = "lazy";
    img.src = yrUrl(p) + "?h=" + Math.floor(Date.now()/WX_MS);
    img.onerror = () => { sc.className = "wx-msg"; sc.textContent = "Nie udało się pobrać meteogramu yr.no."; };
    sc.appendChild(img); el.appendChild(sc);
    el.insertAdjacentHTML("beforeend", `<div class="wx-src">${srcNote("yr")} <a href="${yrPage(p)}" target="_blank" rel="noopener">szczegóły ↗</a></div>`);
  } else {
    const sc = document.createElement("div"); sc.className = "wx-scroll wx-icm";
    sc.innerHTML = `<div class="wx-msg">Ładowanie prognozy ICM…</div>`;
    el.appendChild(sc);
    const note = document.createElement("div"); note.className = "wx-src"; note.innerHTML = srcNote("icm");
    el.appendChild(note);
    try{
      const D = await icmData(p);
      sc.innerHTML = drawICM(D, p);
      note.innerHTML = srcNote("icm") + ` Szare tło = noc; słupki pionowe przy temperaturze i jasne słupki opadu = rozrzut w okolicy punktu. <a href="${icmLink(p)}" target="_blank" rel="noopener">Meteo ICM ↗</a>`;
    }catch(e){
      sc.innerHTML = `<div class="wx-msg">Nie udało się pobrać prognozy ICM (${e.message}). <a href="https://app.meteo.pl/" target="_blank" rel="noopener" style="color:var(--accent)">Otwórz meteo.pl ↗</a></div>`;
    }
  }
}

function weatherBox(region, defaultOpen){
  const places = PLACES.filter(p => p.r === region);
  if (!places.length) return null;
  const box = document.createElement("div");
  box.className = "wx";
  const openKey = "wxOpen:" + region + ":" + (current==="wszystkie" ? "all" : "reg");
  if (!store.get(openKey, defaultOpen)) box.classList.add("closed");
  let place = store.get("wxPlace:" + region, places[0].k);
  if (!places.some(p=>p.k===place)) place = places[0].k;
  const head = document.createElement("div"); head.className = "wx-head";
  const title = document.createElement("div"); title.className = "t";
  title.innerHTML = `<span class="chev">▾</span>Prognoza`;
  title.onclick = () => { box.classList.toggle("closed"); store.set(openKey, !box.classList.contains("closed")); if (!box.classList.contains("closed")) load(); };
  const chips = document.createElement("div"); chips.className = "chips";
  const srcs = document.createElement("div"); srcs.className = "chips";
  const body = document.createElement("div"); body.className = "wx-body";
  const sp = document.createElement("div"); sp.className = "sp";
  head.append(title, chips, sp, srcs);
  box.append(head, body);
  function drawChips(){
    chips.innerHTML = ""; srcs.innerHTML = "";
    if (places.length > 1) places.forEach(p => { const b = document.createElement("button"); b.className = "chip" + (p.k===place?" on":""); b.textContent = p.n;
      b.onclick = () => { place = p.k; store.set("wxPlace:"+region, place); box.classList.remove("closed"); store.set(openKey, true); drawChips(); load(); }; chips.appendChild(b); });
    else chips.innerHTML = `<span class="chip on" style="cursor:default">${places[0].n}</span>`;
    [["yr","yr.no"],["icm","ICM UM"]].forEach(([k,l]) => { const b = document.createElement("button"); b.className = "chip" + (wxSrc===k?" on":""); b.textContent = l;
      b.onclick = () => { wxSrc = k; store.set("wxSrc", k); box.classList.remove("closed"); store.set(openKey, true); refreshWeather(); }; srcs.appendChild(b); });
  }
  function load(){ if (box.classList.contains("closed")) return; fillWeather(body, places.find(p=>p.k===place), wxSrc); }
  box._load = () => { drawChips(); load(); };
  box._load();
  return box;
}

const MAP_LAYERS = [["radar","Radar opadów"],["satellite","Satelita"],["clouds","Chmury (prognoza)"]];
const windyUrl = ov => `https://embed.windy.com/embed2.html?lat=49.40&lon=19.70&detailLat=49.40&detailLon=19.70&zoom=7&level=surface&overlay=${ov}&product=ecmwf&menu=&message=true&marker=&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1`;
function weatherMap(main){
  let layer = store.get("wxMap", "radar");
  if (!MAP_LAYERS.some(([k])=>k===layer)) layer = "radar";
  const box = document.createElement("div"); box.className = "wx wxmap";
  const head = document.createElement("div"); head.className = "wx-head";
  head.innerHTML = `<div class="t">Mapa</div>`;
  const chips = document.createElement("div"); chips.className = "chips";
  head.appendChild(chips);
  const body = document.createElement("div"); body.className = "wx-body";
  const f = document.createElement("iframe"); f.loading = "lazy"; f.title = "Mapa Windy"; f.allow = "fullscreen";
  const note = document.createElement("div"); note.className = "wx-src";
  note.innerHTML = `Mapa: <a href="https://www.windy.com/?49.40,19.70,7" target="_blank" rel="noopener">Windy.com</a>. Radar i satelita – dane bieżące (przycisk ▶ odtwarza ostatnie godziny; w nocy chmury z satelity widać w kanale INF), chmury – prognoza modelu z suwakiem czasu.`;
  body.append(f, note);
  box.append(head, body);
  function draw(){
    chips.innerHTML = "";
    MAP_LAYERS.forEach(([k,l]) => { const b = document.createElement("button"); b.className = "chip" + (k===layer?" on":""); b.textContent = l;
      b.onclick = () => { layer = k; store.set("wxMap", k); draw(); }; chips.appendChild(b); });
    f.src = windyUrl(layer);
  }
  box._load = () => { f.src = windyUrl(layer); };
  draw();
  main.appendChild(box);
}

function weatherPage(main){
  weatherMap(main);
  PLACES.forEach(p => {
    const h = document.createElement("h2"); h.textContent = p.n + " · " + p.r; main.appendChild(h);
    const grid = document.createElement("div"); grid.className = "wxgrid";
    ["yr","icm"].forEach(src => {
      const card = document.createElement("div"); card.className = "wx wxcard";
      const b = document.createElement("div"); b.className = "wx-body"; b.style.paddingTop = "10px";
      b.innerHTML = `<h3>${src==="yr" ? "yr.no (48 h)" : "ICM UM 4 km (60 h)"}</h3>`;
      const inner = document.createElement("div"); b.appendChild(inner);
      card.appendChild(b); grid.appendChild(card);
      card._load = () => fillWeather(inner, p, src);
      card._load();
    });
    main.appendChild(grid);
  });
}
function refreshWeather(){ document.querySelectorAll(".wx").forEach(b => b._load && b._load()); }

/* ---------- tiles ---------- */
function tile(c){
  const el = document.createElement("div");
  el.className = "tile";
  const frame = document.createElement("div");
  frame.className = "frame";
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = `<span class="name"></span><span class="info"></span>`;
  meta.querySelector(".name").textContent = c.n;
  const info = meta.querySelector(".info");

  if (c.t === "img"){
    frame.innerHTML = `<span class="badge">zdjęcie</span>`;
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = c.n; img.referrerPolicy = "no-referrer";
    img.title = "Godzina wykonania zdjęcia jest w jego rogu";
    img.onload = () => { info.textContent = "sprawdzono " + hhmm(new Date()); info.classList.remove("err"); };
    img.onerror = () => {
      if (c.s2 && img.dataset.src !== c.s2){ img.dataset.src = c.s2; img.src = bust(c.s2); info.textContent = "zapasowe źródło"; return; }
      info.textContent = "brak obrazu"; info.classList.add("err");
    };
    img.dataset.src = c.s; img.dataset.primary = c.s;
    img.src = bust(c.s);
    frame.prepend(img);
  } else if (c.t === "hls" && autoplay){
    const v = document.createElement("video");
    v.muted = true; v.autoplay = true; v.playsInline = true; v.setAttribute("playsinline","");
    frame.appendChild(v);
    frame.insertAdjacentHTML("beforeend", `<span class="badge live">● na żywo</span>`);
    players.set(v, attachHls(v, c.s));
    const fail = ()=>{ info.textContent="brak sygnału"; info.classList.add("err"); showBlocked(frame, c); };
    v.addEventListener("hlsfatal", fail);
    v.addEventListener("error", fail);
    info.textContent = "wideo";
  } else if (c.t === "embed" && (autoplay || (thumbs && c.thumb !== false))){
    const f = document.createElement("iframe");
    f.src = autoplay ? c.s : c.s.replace("autoPlay=1","autoPlay=0");
    f.loading = "lazy"; f.allow = "autoplay; fullscreen"; f.referrerPolicy = "no-referrer";
    frame.appendChild(f);
    info.textContent = "odtwarzacz";
  } else if (c.t === "hls" && thumbs){
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.setAttribute("playsinline",""); v.preload = "auto";
    frame.appendChild(v);
    frame.insertAdjacentHTML("beforeend", `<div class="ph overlay"><div class="play"></div></div><span class="badge">podgląd</span>`);
    info.textContent = "ładowanie…";
    const t = {v, c, info, frame, h:null};
    thumbList.push(t);
    grabThumb(t);
  } else {
    frame.innerHTML = `<div class="ph"><div class="play"></div><div>${c.t==="hls" ? "wideo na żywo" : "odtwarzacz dostawcy"} – stuknij</div></div>`;
    info.textContent = c.t==="hls" ? "wideo" : "odtwarzacz";
  }
  el.append(frame, meta);
  el.onclick = () => openModal(c.i);
  return el;
}

function render(){
  destroyTilePlayers();
  destroyThumbs();
  const main = document.getElementById("main");
  main.innerHTML = "";
  if (current==="pogoda"){ weatherPage(main); renderTabs(); return; }
  const regions = current==="wszystkie" ? REGIONS : REGIONS.filter(r=>slug(r)===current);
  regions.forEach(r=>{
    const cams = CAMS.filter(c=>c.r===r);
    if (!cams.length) return;
    if (current==="wszystkie"){ const h=document.createElement("h2"); h.textContent=r; main.appendChild(h); }
    const wx = weatherBox(r, current!=="wszystkie");
    if (wx) main.appendChild(wx);
    const g = document.createElement("div"); g.className="grid";
    cams.forEach(c=>g.appendChild(tile(c)));
    main.appendChild(g);
  });
  renderTabs();
}

function refreshImages(){
  document.querySelectorAll("img[data-src]").forEach(img=>{ if (img.dataset.primary) img.dataset.src = img.dataset.primary; img.src = bust(img.dataset.src); });
  const mimg = document.querySelector("#mbody img[data-src]");
  if (mimg) mimg.src = bust(mimg.dataset.src);
}

/* ---------- modal ---------- */
let modalIdx = -1, modalHls = null;
function visibleList(){
  const list = (current==="wszystkie" || current==="pogoda") ? CAMS : CAMS.filter(c=>slug(c.r)===current);
  return list.slice().sort((a,b)=>REGIONS.indexOf(a.r)-REGIONS.indexOf(b.r) || a.i-b.i);
}
function clearModalMedia(){
  if (modalHls){ try{modalHls.destroy()}catch(e){} modalHls=null; }
  document.querySelectorAll("#mbody > :not(.nav-arrow)").forEach(n=>{
    if (n.tagName==="VIDEO"){ n.pause(); n.removeAttribute("src"); n.load(); }
    n.remove();
  });
}
function openModal(i){
  modalIdx = i;
  const c = CAMS[i];
  clearModalMedia();
  document.getElementById("mtitle").textContent = c.n;
  document.getElementById("msrc").href = c.p;
  const body = document.getElementById("mbody");
  let m;
  if (c.t==="img"){
    m = document.createElement("img"); m.referrerPolicy="no-referrer"; m.alt=c.n;
    m.dataset.src = c.s; m.src = bust(c.s);
    m.onerror = () => { if (c.s2 && m.dataset.src !== c.s2){ m.dataset.src = c.s2; m.src = bust(c.s2); } };
  } else if (c.t==="hls"){
    m = document.createElement("video");
    m.controls = true; m.autoplay = true; m.muted = true; m.playsInline = true; m.setAttribute("playsinline","");
    modalHls = attachHls(m, c.s);
    const fail = ()=>showBlocked(body, c);
    m.addEventListener("hlsfatal", fail);
    m.addEventListener("error", fail);
  } else {
    m = document.createElement("iframe");
    m.src = c.s; m.allow = "autoplay; fullscreen"; m.allowFullscreen = true; m.referrerPolicy="no-referrer";
  }
  body.prepend(m);
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  clearModalMedia();
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
  modalIdx = -1;
}
function step(d){
  const list = visibleList();
  let pos = list.findIndex(c=>c.i===modalIdx);
  if (pos<0) pos=0;
  openModal(list[(pos + d + list.length) % list.length].i);
}

/* ---------- events ---------- */
document.getElementById("mclose").onclick = closeModal;
document.getElementById("mprev").onclick = e => { e.stopPropagation(); step(-1); };
document.getElementById("mnext").onclick = e => { e.stopPropagation(); step(1); };
document.addEventListener("keydown", e=>{
  if (modalIdx<0) return;
  if (e.key==="Escape") closeModal();
  if (e.key==="ArrowLeft") step(-1);
  if (e.key==="ArrowRight") step(1);
});
let tx=null;
document.getElementById("mbody").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
document.getElementById("mbody").addEventListener("touchend",e=>{
  if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null;
  if (Math.abs(dx)>60 && CAMS[modalIdx] && CAMS[modalIdx].t==="img") step(dx<0?1:-1);
},{passive:true});

const ap = document.getElementById("autoplay");
ap.checked = autoplay;
ap.onchange = () => { autoplay = ap.checked; store.set("autoplay", autoplay); render(); };
const th = document.getElementById("thumbs");
th.checked = thumbs;
th.onchange = () => { thumbs = th.checked; store.set("thumbs", thumbs); render(); };
document.getElementById("refresh").onclick = () => { refreshImages(); refreshThumbs(); };

function fromHash(){
  const h = location.hash.slice(1);
  const valid = ["wszystkie"].concat(REGIONS.map(slug), ["pogoda"]);
  current = valid.includes(h) ? h : store.get("tab","wszystkie");
  if (!valid.includes(current)) current = "wszystkie";
  store.set("tab", current);
  render();
}
window.addEventListener("hashchange", fromHash);

// odświeżanie zdjęć + oszczędzanie danych, gdy karta jest ukryta
setInterval(()=>{ if (!document.hidden) refreshImages(); }, REFRESH_MS);
let lastThumbs = Date.now();
let lastWx = Date.now();
setInterval(()=>{ if (!document.hidden){ refreshWeather(); lastWx = Date.now(); } }, WX_MS);
setInterval(()=>{ if (!document.hidden && !autoplay){ refreshThumbs(); lastThumbs = Date.now(); } }, THUMB_MS);
document.addEventListener("visibilitychange", ()=>{
  if (document.hidden){ players.forEach((h,v)=>v.pause()); }
  else { if (Date.now()-lastWx > WX_MS){ refreshWeather(); lastWx = Date.now(); } refreshImages(); if (Date.now()-lastThumbs > THUMB_MS){ refreshThumbs(); lastThumbs = Date.now(); } players.forEach((h,v)=>{ v.play().catch(()=>{}); }); }
});

fromHash();
</script>
